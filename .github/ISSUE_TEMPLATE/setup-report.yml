name: My setup (works / doesn't work)
description: Share what you tried it on, so others know what works with what.
title: "[Setup] <TV model> + <lights>"
labels: [setup-report]
body:
  - type: input
    id: tv
    attributes:
      label: TV and OS
      placeholder: "Sony Bravia XR, Google TV 12 / Chromecast with Google TV…"
    validations:
      required: true
  - type: input
    id: devices
    attributes:
      label: Lights and devices
      placeholder: "Hue, IKEA via Home Assistant, Tuya fan…"
  - type: input
    id: host
    attributes:
      label: Bridge host and scan
      placeholder: "Raspberry Pi 5 / Mac mini; iPhone 15 Pro scan / drawn plan…"
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Everything works
        - Works with workarounds (please describe)
        - Blocked (please describe)
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: What happened
      description: Workarounds, errors, the phase where it got hard. Do not paste tokens, IPs or your scan.
